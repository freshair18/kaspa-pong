name: Build release packages

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version (e.g. v2.0.0-alpha.2). Leave blank for build artifacts only.
        required: false
        type: string

permissions:
  contents: read

jobs:
  package:
    name: Package ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2025
            platform: windows-x64
            protoc: win64
            protoc_sha256: f0c128dc0d8492eceece83bb459a4c0e316764b929ffbf1aa416357fd644edd3
          - runner: ubuntu-24.04
            platform: linux-x64
            protoc: linux-x86_64
            protoc_sha256: 121f6c7afe1d4d0e3ea6aab9432038599250134cbf4474cb1167d2c7decd4278
          - runner: macos-15
            platform: macos-arm64
            protoc: osx-aarch_64
            protoc_sha256: 9cd98a532c5c5e0c4161314de0225de27e4c8a323917b6ea7b1b714d3ae23466
          - runner: macos-15-intel
            platform: macos-x64
            protoc: osx-x86_64
            protoc_sha256: 228cc7add4616cc14ca5e80dee83209d44449a7aee95a914ae748fa374efb078
    defaults:
      run:
        shell: pwsh
        working-directory: pong
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Install protoc
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $archive = Join-Path $env:RUNNER_TEMP 'protoc.zip'
          $destination = Join-Path $env:RUNNER_TEMP 'protoc'
          Invoke-WebRequest 'https://github.com/protocolbuffers/protobuf/releases/download/v36.2/protoc-36.2-${{ matrix.protoc }}.zip' -OutFile $archive
          if ((Get-FileHash $archive).Hash -ne '${{ matrix.protoc_sha256 }}') {
            throw 'Unexpected protoc checksum'
          }
          Expand-Archive -LiteralPath $archive -DestinationPath $destination
          $bin = Join-Path $destination 'bin'
          if (-not $IsWindows) { chmod +x "$bin/protoc" }
          $bin >> $env:GITHUB_PATH
      - name: Build
        run: cargo build --locked --release --target-dir target
      - name: Package
        id: package
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $bundle = 'kaspa-pong-${{ matrix.platform }}'
          $extension = if ($IsWindows) { '.exe' } else { '' }
          New-Item -ItemType Directory $bundle | Out-Null
          $client = "target/release/pong$extension"
          if (-not (Test-Path -LiteralPath $client)) {
            # Older tags built the client under a different target name.
            $client = "target/release/pong-node$extension"
          }
          Copy-Item -LiteralPath $client -Destination "$bundle/pong$extension"
          Copy-Item -Recurse artifacts, LICENSE -Destination $bundle
          if (Test-Path -LiteralPath '../ADVANCED.md') {
            Copy-Item -Recurse config -Destination $bundle
            foreach ($guide in 'README.md', 'ADVANCED.md') {
              $guideText = Get-Content -Raw -LiteralPath "../$guide"
              if ($guide -eq 'README.md') {
                $guideText = $guideText -replace '(?s)<details>\s*<summary>Build from source</summary>.*?</details>\s*', ''
              }
              $guideText.Replace('](pong/', '](') | Set-Content -LiteralPath "$bundle/$guide" -Encoding utf8NoBOM -NoNewline
            }
          }
          if (-not $IsWindows) { chmod +x "$bundle/pong" }
          & "./$bundle/pong$extension" --help

          if ($IsWindows) {
            $archive = "$bundle.zip"
            Compress-Archive -LiteralPath $bundle -DestinationPath $archive
          } else {
            $archive = "$bundle.tar.gz"
            tar -czf $archive $bundle
          }
          "file=pong/$archive" >> $env:GITHUB_OUTPUT
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: ${{ steps.package.outputs.file }}
          archive: false
          if-no-files-found: error

  draft:
    name: Prepare release draft
    if: inputs.version != ''
    needs: package
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    concurrency:
      group: pong-release-${{ inputs.version }}
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: kaspa-pong-*
          path: packages
          merge-multiple: true
          skip-decompress: true
      - name: Create or update draft
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ inputs.version }}
        run: |
          if [[ ! "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?(\+[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$ ]]; then
            echo "::error::Use a version like v2.0.0 or v2.0.0-alpha.2."
            exit 1
          fi

          packages=(
            packages/kaspa-pong-windows-x64.zip
            packages/kaspa-pong-linux-x64.tar.gz
            packages/kaspa-pong-macos-arm64.tar.gz
            packages/kaspa-pong-macos-x64.tar.gz
          )
          for package in "${packages[@]}"; do
            if [[ ! -s "$package" ]]; then
              echo "::error::Missing package: $package"
              exit 1
            fi
          done

          tag_ref="refs/tags/$VERSION"
          refs=$(git ls-remote "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git" "$tag_ref" "$tag_ref^{}")
          tag_commit=$(awk -v ref="$tag_ref" '
            $2 == ref { object = $1 }
            $2 == ref "^{}" { commit = $1 }
            END { print (commit ? commit : object) }
          ' <<< "$refs")
          if [[ -n "$tag_commit" && "$tag_commit" != "$GITHUB_SHA" ]]; then
            echo "::error::$VERSION already tags $tag_commit. Choose a new version."
            exit 1
          fi

          releases=$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" |
            jq -cs --arg version "$VERSION" '[.[][] | select(.tag_name == $version)]')

          case "$(jq 'length' <<< "$releases")" in
            0)
              options=(--draft --target "$GITHUB_SHA" --title "$VERSION" --generate-notes)
              if [[ "${VERSION%%+*}" == *-* ]]; then
                options+=(--prerelease)
              fi
              url=$(gh release create "$VERSION" "${options[@]}" "${packages[@]}")
              ;;
            1)
              if [[ "$(jq -r '.[0].draft' <<< "$releases")" != true ]]; then
                echo "::error::$VERSION is already published. Choose a new version."
                exit 1
              fi
              target=$(jq -r '.[0].target_commitish' <<< "$releases")
              if [[ "$target" != "$GITHUB_SHA" && "$tag_commit" != "$GITHUB_SHA" ]]; then
                if [[ "$GITHUB_REF_TYPE" != branch || "$target" != "$GITHUB_REF_NAME" ||
                      "$(jq '.[0].assets | length' <<< "$releases")" != 0 ]]; then
                  echo "::error::The existing draft targets $target. Use its matching branch or choose a new version."
                  exit 1
                fi
                # Pin an empty draft created in the GitHub UI to the commit built by this run.
                release_id=$(jq -r '.[0].id' <<< "$releases")
                gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/$release_id" \
                  -f target_commitish="$GITHUB_SHA" >/dev/null
              fi
              gh release upload "$VERSION" "${packages[@]}" --clobber
              url=$(jq -r '.[0].html_url' <<< "$releases")
              ;;
            *)
              echo "::error::More than one release uses $VERSION. Choose a new version."
              exit 1
              ;;
          esac

          printf 'Release draft for commit `%s`\n\n[Review %s](%s)\n' "$GITHUB_SHA" "$VERSION" "$url" >> "$GITHUB_STEP_SUMMARY"
