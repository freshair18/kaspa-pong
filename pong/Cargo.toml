[package]
name = "kaspa-pong"
version = "2.0.0-dev"
edition = "2024"
rust-version = "1.94.0"
license = "ISC"
description = "Covenant-enforced Pong on Kaspa, built with the Argent SDK"
autobins = false
autotests = false

[features]
default = ["node"]
node = ["dep:async-channel", "dep:kaspa-notify", "dep:kaspa-grpc-client", "dep:kaspa-wrpc-client", "dep:kaspa-rpc-core", "dep:kaspa-addresses", "dep:tokio", "dep:crossterm", "dep:getrandom", "dep:url"]
tooling = ["dep:argent"]

[dependencies]
argent = { git = "https://github.com/argent-lang/argent", branch = "master", optional = true }
argent-runtime = { git = "https://github.com/argent-lang/argent", branch = "master" }
blake2b_simd = "1.0.2"
clap = { version = "4.6.1", features = ["derive"] }
kaspa-consensus-core = "=2.1.0"
kaspa-txscript = "=2.1.0"
secp256k1 = { version = "0.29.0", features = ["global-context"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
getrandom = { version = "0.2", optional = true }
async-channel = { version = "2", optional = true }
url = { version = "2.5.4", optional = true }
kaspa-notify = { version = "=2.1.0", optional = true }
crossterm = { version = "0.29", optional = true }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"], optional = true }
kaspa-grpc-client = { version = "=2.1.0", optional = true }
kaspa-wrpc-client = { version = "=2.1.0", optional = true }
kaspa-rpc-core = { version = "=2.1.0", optional = true }
kaspa-addresses = { version = "=2.1.0", optional = true }

[[bin]]
name = "pong-node"
path = "src/pong_node.rs"
required-features = ["node"]

[[bin]]
name = "pong-build"
path = "src/build.rs"
required-features = ["tooling"]

[[test]]
name = "contract"
required-features = ["tooling"]

[[test]]
name = "node"
required-features = ["node"]

[[test]]
name = "gameplay"

[[test]]
name = "ui"
required-features = ["node"]
